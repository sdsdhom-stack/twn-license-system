<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwnTool Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#120e17] text-white flex items-center justify-center min-h-screen">
  <div class="bg-[#1e1726] p-8 rounded-2xl shadow-xl w-96 text-center border border-purple-900/30">
    <div class="w-16 h-16 bg-purple-600 rounded-2xl flex items-center justify-center text-3xl font-bold mx-auto mb-4 shadow-lg shadow-purple-500/30">T</div>
    <h1 class="text-2xl font-bold mb-1">TwnTool Admin</h1>
    <p class="text-xs text-gray-400 mb-6">لوحة إدارة التراخيص</p>

    <div class="space-y-4">
      <div>
        <label class="block text-right text-xs text-gray-400 mb-1">كلمة المرور</label>
        <input type="password" id="adminPass" placeholder="••••••••" class="w-full bg-[#120e17] border border-gray-700/60 rounded-xl p-3 text-center text-sm focus:outline-none focus:border-purple-500 transition">
      </div>
      <button onclick="login()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium p-3 rounded-xl transition duration-200">دخول</button>
    </div>
    <p class="text-[10px] text-gray-500 mt-8">© 2026 TwnTool - نظام إدارة التراخيص</p>
  </div>
</body>
</html>
